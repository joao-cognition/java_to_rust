# Travel Shopping & Reservation API
# Profiles select the database: h2 (default, in-memory) or postgres (docker compose --profile postgres up -d).
spring.profiles.active=h2

server.port=9966
server.servlet.context-path=/travel/

# Schema and static reference data are applied at every start (both are idempotent); flights, fares and bookings
# are generated by DemoDataSeeder when the flight table is empty.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/${spring.sql.init.platform}/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Demo data generator: same seed, same data. The schedule window starts the day after the server starts.
travel.demo.seed=20261103
travel.demo.days=30
travel.demo.bookings=200

# Errors are RFC 9457 problem details
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework=INFO
