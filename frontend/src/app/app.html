<header class="bar">
  <span class="name">java_to_rust</span>
  <span class="dim">spring-petclinic-rest · java → rust · amadeus tsr modernization</span>
  <span class="spacer"></span>
  @for (k of kinds; track k) {
    <span class="svc {{ k }}">{{ k }}</span><span class="dim">:{{ services[k].port }}</span>
    <span [class.good]="up()[k].startsWith('up')" [class.bad]="up()[k] === 'down'">{{ up()[k] }}</span>
  }
</header>
<main class="single">
  <api-pane class="pane"></api-pane>
  <footer class="dim">benchmarks live in the terminal: <code>j2r bench</code> (see cli/). this page only shows raw API responses.</footer>
</main>
